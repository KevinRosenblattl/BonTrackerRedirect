<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Opening App...</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
        }
    </style>
</head>
<body>
    <h1>Opening App...</h1>
    <p>If the app doesn't open automatically, please open it manually.</p>
    
    <script>
    const searchParams = new URLSearchParams(window.location.search);
    const code = searchParams.get('code');
    const type = searchParams.get('type'); // 'recovery' oder 'signup'

    if (code) {
        let deepLink;
        if (type === 'recovery') {
            deepLink = `ocrtesting://reset-password?code=${code}`;
        } else if (type === 'signup') {
            deepLink = `ocrtesting://confirm-email?code=${code}`;
        } else {
            document.body.innerHTML = '<h1>Unknown type: ' + type + '</h1>';
            throw new Error('Unknown type');
        }

        console.log('Opening:', deepLink);
        window.location = deepLink;
    } else {
        document.body.innerHTML = '<h1>No code found</h1><p>URL: ' + window.location.href + '</p>';
    }

    setTimeout(() => {
        document.body.innerHTML += '<br><p>Please open the app manually.</p>';
    }, 3000);
</script>
</body>
</html>
